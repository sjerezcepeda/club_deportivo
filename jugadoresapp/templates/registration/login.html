{% extends 'jugadoresapp/base.html' %}

{% block contenido %}

<style>
    .login-card {
        max-width: 460px;
        margin: 40px auto;
        border: none;
        border-radius: 16px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
    }

    .login-form-row {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
    }

    .login-form-row label {
        width: 120px;
        margin-bottom: 0;
        font-weight: 600;
        text-align: right;
        padding-right: 15px;
    }

    .login-form-row input {
        width: 100%;
        height: 42px;
        padding: 8px 12px;
        border: 1px solid #bdbdbd;
        border-radius: 6px;
        box-sizing: border-box;
    }

    .login-form-row input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.18);
    }

    .login-button {
        width: calc(100% - 0px);
        margin-left: 0px;
        height: 44px;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: 600;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .login-button:hover {
        opacity: 0.9;
    }

    @media (max-width: 500px) {
        .login-form-row {
            display: block;
        }

        .login-form-row label {
            display: block;
            width: 100%;
            text-align: left;
            padding-right: 0;
            margin-bottom: 6px;
        }

        .login-button {
            width: 100%;
            margin-left: 0;
        }
    }
</style>

<div class="card login-card">
    <div class="card-body p-4">

        <h2 class="text-center mb-4">
            Iniciar sesión
        </h2>

        {% if form.errors %}
        <div class="alert alert-danger">
            Usuario o contraseña incorrectos.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="login-form-row">
                <label for="id_username">
                    Usuario
                </label>

                <input type="text" name="username" id="id_username" maxlength="20" required>
            </div>

            <div class="login-form-row">
                <label for="id_password">
                    Contraseña
                </label>

                <input type="password" name="password" id="id_password" maxlength="20" required>
            </div>

            <button type="submit" class="login-button">
                Iniciar sesión
            </button>
        </form>

        <hr>

        <p class="text-center mb-0">
            ¿No tienes una cuenta?

            <a href="{% url 'registro' %}">
                Crear cuenta
            </a>
        </p>

    </div>
</div>

<script>
    const campoUsuario = document.getElementById('id_username');

    if (campoUsuario) {
        campoUsuario.addEventListener('input', function () {
            this.value = this.value.replace(
                /(.)\1{2,}/gi,
                '$1$1'
            );
        });
    }
</script>

{% endblock %}
